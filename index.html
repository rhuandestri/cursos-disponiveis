<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos Disponíveis</title>
<style>
  :root{
    --bg:#f3f6f2;
    --surface:#ffffff;
    --surface-2:#f0f5ef;
    --text:#1b2420;
    --muted:#5d6a63;
    --border:#dbe3dc;
    --primary:#2e6b3a;
    --primary-ink:#ffffff;
    --accent-soft:#e4f0e6;
    --weekend-bg:#fff4cf;
    --weekend-ink:#6a4d00;
    --weekend-tag:#f2c230;
    --danger:#b3372b;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0f1512;
    --surface:#18201b;
    --surface-2:#1f2923;
    --text:#e6ece7;
    --muted:#98a69d;
    --border:#2a3530;
    --primary:#6cc081;
    --primary-ink:#0d1810;
    --accent-soft:#1f3026;
    --weekend-bg:#2e2510;
    --weekend-ink:#f3d27a;
    --weekend-tag:#b38a18;
    --danger:#e46d5f;
    --shadow:none;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;
    padding:24px 28px 48px;line-height:1.45;
  }
  .wrap{width:100%;margin:0}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  h1{margin:0;font-size:26px;color:var(--primary);letter-spacing:-.01em}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
  .acoes-topo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  button{font:inherit;font-size:14px;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid transparent;transition:opacity .15s,background .15s}
  button:hover{opacity:.85}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .btn-primary{background:var(--primary);color:var(--primary-ink);font-weight:600}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  .btn-small{padding:5px 10px;font-size:13px}

  .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start;width:100%}
  section{min-width:0}

  /* ---- coluna de cursos ---- */
  .sidebar{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:8px;position:sticky;top:16px;
  }
  .sidebar h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:8px 10px 6px}
  .lista-cursos{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  .item-curso{
    width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;
    text-align:left;background:transparent;color:var(--text);border:1px solid transparent;
    padding:9px 12px;font-size:15px;border-radius:10px;
  }
  .item-curso:hover{background:var(--surface-2);opacity:1}
  .item-curso[aria-pressed="true"]{background:var(--accent-soft);color:var(--primary);border-color:var(--primary);font-weight:600}
  .item-curso .qtd{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px;white-space:nowrap}
  .item-curso[aria-pressed="true"] .qtd{background:var(--surface);color:var(--primary)}
  .item-curso .nome{min-width:0;overflow-wrap:anywhere;line-height:1.3}

  /* ---- barra de busca e tabela ---- */
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .toolbar input[type="search"]{flex:1;min-width:200px}
  input,select,textarea{
    font:inherit;font-size:14px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border);border-radius:10px;padding:9px 11px;width:100%;
  }
  .campo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .campo select{width:auto}

  .resumo{font-size:13px;color:var(--muted);margin:0 2px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filtro-ativo{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--primary);padding:2px 10px;border-radius:999px;font-weight:600}
  .filtro-ativo button{padding:0 6px;font-size:14px;line-height:1;background:transparent;color:var(--primary);border:0}
  .status{font-size:13px;color:var(--muted)}
  .status.erro{color:var(--danger)}

  .tabela-wrap{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:15px;vertical-align:middle}
  td.curso{white-space:normal;min-width:220px;overflow-wrap:anywhere}
  th{background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--surface-2)}
  tr.fds td{background:var(--weekend-bg)}
  tr.fds:hover td{background:var(--weekend-bg);filter:brightness(.97)}
  tr.encerrada td{color:var(--muted)}
  .nowrap{white-space:nowrap}
  .prox{font-weight:700;font-size:15px}
  .curso{font-weight:600}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--primary);white-space:nowrap}
  .badge.fds{background:var(--weekend-tag);color:#3d2d00}
  .badge.parcial{background:var(--weekend-bg);color:var(--weekend-ink);border:1px solid var(--weekend-tag)}
  .badge.enc{background:var(--surface-2);color:var(--muted)}
  .datas{display:flex;flex-wrap:wrap;gap:5px;min-width:240px}
  .chip{font-size:12px;padding:2px 7px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
  .chip.fds{background:var(--weekend-tag);color:#3d2d00;border-color:var(--weekend-tag)}
  .acoes{display:flex;gap:6px;justify-content:flex-end}
  .vazio{text-align:center;color:var(--muted);padding:40px 16px}

  dialog{
    border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);
    padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  dialog::backdrop{background:rgba(0,0,0,.5)}
  dialog form{padding:20px;display:grid;gap:14px}
  dialog h2{margin:0;font-size:18px;color:var(--primary)}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .campos .full{grid-column:1/-1}
  label.rot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
  .dica{font-size:12px;color:var(--muted)}
  .botoes-modal{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static}
    .lista-cursos{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  }
  @media (max-width:560px){
    .campos{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Cursos disponíveis</h1>
      <p class="sub">Turmas, datas e horários. Clique em um curso para ver só as turmas dele.</p>
    </div>
    <div class="acoes-topo">
      <button class="btn-ghost" id="btn-tema" type="button" aria-label="Alternar modo claro e escuro">🌙 Escuro</button>
      <button class="btn-primary" id="btn-novo" type="button">+ Nova turma</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" aria-label="Cursos">
      <h2>Cursos</h2>
      <ul class="lista-cursos" id="lista-cursos"></ul>
    </aside>

    <section>
      <div class="toolbar">
        <input id="busca" type="search" placeholder="Buscar por curso, turma ou horário…" aria-label="Buscar">
        <label class="campo">Fim de semana
          <select id="filtro-fds">
            <option value="">Todos</option>
            <option value="Sim">Só fim de semana</option>
            <option value="Parcial">Parcial</option>
            <option value="Não">Só dias úteis</option>
          </select>
        </label>
        <label class="campo">Ordenar
          <select id="ordem">
            <option value="data">Data mais próxima</option>
            <option value="curso">Curso</option>
            <option value="turma">Turma</option>
          </select>
        </label>
      </div>

      <div class="resumo">
        <span id="contador"></span>
        <span id="filtro-curso-wrap"></span>
        <span class="status" id="status"></span>
      </div>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Próxima data</th>
              <th>Curso</th>
              <th>Turma</th>
              <th>Horário</th>
              <th>Datas</th>
              <th>Fim de semana</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corpo" aria-live="polite"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlg-titulo">Nova turma</h2>
    <div class="campos">
      <label class="rot">Turma (código)
        <input id="f-turma" required placeholder="ex: 718.953">
      </label>
      <label class="rot">Horário
        <input id="f-horario" required placeholder="ex: 08h00 às 17h00">
      </label>
      <label class="rot full">Curso
        <input id="f-curso" required placeholder="ex: NR.35">
      </label>
      <label class="rot full">Datas
        <textarea id="f-datas" rows="3" required placeholder="03/11/2026, 04/11/2026, 05/11/2026"></textarea>
        <span class="dica">Use dd/mm/aaaa, separadas por vírgula.</span>
      </label>
    </div>
    <div class="botoes-modal">
      <button class="btn-ghost" type="button" id="btn-cancelar">Cancelar</button>
      <button class="btn-primary" type="submit" id="btn-salvar">Salvar</button>
    </div>
  </form>
</dialog>

<script>
  /* =========================================================
     CONFIGURAÇÃO DO SUPABASE
     Preencha url e key (chave publicável, sb_publishable_... ou anon).
     Enquanto estiver vazio, os dados ficam só neste navegador.
     Tabela esperada: cursos (id uuid, turma text, curso text,
     horario text, datas date[]).
     ========================================================= */
  const CFG = {
    url: '',
    key: '',
    tabela: 'cursos'
  };

  const KEY_LOCAL = 'cursos_disponiveis_v1';
  const KEY_TEMA = 'cursos_tema';
  const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];

  const SEED = [
    {turma:'718.953', curso:'Operador de Empilhadeira - Formação', horario:'12h00 às 17h00',
     datas:['2026-11-03','2026-11-04','2026-11-05','2026-11-06','2026-11-09','2026-11-10']},
    {turma:'718.955', curso:'Operador de Empilhadeira - Formação', horario:'08h10 às 17h20',
     datas:['2026-11-10','2026-11-11','2026-11-12','2026-11-13']},
    {turma:'718.990', curso:'Operador de Empilhadeira - Formação', horario:'08h10 às 17h20',
     datas:['2026-11-01','2026-11-07','2026-11-08','2026-11-14']},
    {turma:'719.260', curso:'Operador de Empilhadeira - Formação', horario:'08h10 às 17h20',
     datas:['2026-11-21','2026-11-22','2026-11-28','2026-11-29']},
    {turma:'698.097', curso:'Operador de Munk', horario:'08h00 às 17h00',
     datas:['2026-11-28','2026-11-29']},
    {turma:'719.681', curso:'MOPP - Formação', horario:'08h15 às 17h30',
     datas:['2027-01-04','2027-01-05','2027-01-06','2027-01-07','2027-01-08','2027-01-11']},
    {turma:'719.683', curso:'Coletivo - Formação', horario:'08h15 às 17h30',
     datas:['2027-01-18','2027-01-19','2027-01-20','2027-01-21','2027-01-22','2027-01-25']},
    {turma:'718.963', curso:'NR.35', horario:'08h00 às 17h00',
     datas:['2026-11-12']},
    {turma:'718.971', curso:'NR.20', horario:'12h30 às 17h30',
     datas:['2026-11-09']}
  ];

  const $ = id => document.getElementById(id);
  const usaRemoto = () => !!(CFG.url && CFG.key);

  let cursos = [];
  let editandoId = null;
  let cursoSel = '';   // nome do curso filtrado pela coluna lateral; '' = todos

  /* ---------- utilidades de data ---------- */
  function toDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
  function fmtBR(iso){ const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
  function hoje(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
  function isFds(iso){ const w = toDate(iso).getDay(); return w === 0 || w === 6; }
  function statusFds(datas){
    const n = datas.filter(isFds).length;
    if (!n) return 'Não';
    if (n === datas.length) return 'Sim';
    return 'Parcial';
  }
  function proximaData(datas){
    const h = hoje();
    const futuras = datas.filter(d => toDate(d) >= h).sort();
    return futuras[0] || null;
  }
  function chaveData(c){ return proximaData(c.datas) || '9999-12-31'; }
  function parseDatas(texto){
    const ms = [...texto.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g)];
    const set = new Set(ms.map(m => `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`));
    return [...set].sort();
  }
  function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  /* ---------- tema ---------- */
  function aplicarTema(t){
    document.documentElement.dataset.theme = t;
    $('btn-tema').textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  }
  function iniciarTema(){
    const salvo = localStorage.getItem(KEY_TEMA);
    const t = salvo || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    aplicarTema(t);
  }
  $('btn-tema').addEventListener('click', () => {
    const novo = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(KEY_TEMA, novo);
    aplicarTema(novo);
  });

  /* ---------- armazenamento ---------- */
  function setStatus(texto, erro=false){
    const el = $('status');
    el.textContent = texto;
    el.classList.toggle('erro', erro);
  }

  async function api(method, query='', body){
    const headers = {
      apikey: CFG.key,
      Authorization: `Bearer ${CFG.key}`,
      'Content-Type': 'application/json'
    };
    if (method === 'POST' || method === 'PATCH') headers.Prefer = 'return=minimal';
    const res = await fetch(`${CFG.url}/rest/v1/${CFG.tabela}${query}`, {
      method, headers, body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) throw new Error(await res.text());
    if (method !== 'GET') return null;
    const rows = await res.json();
    return rows.map(r => ({id: r.id, turma: r.turma, curso: r.curso, horario: r.horario, datas: r.datas}));
  }

  function carregarLocal(){
    try {
      const s = JSON.parse(localStorage.getItem(KEY_LOCAL));
      if (Array.isArray(s)) return s;
    } catch(e){}
    return SEED.map(c => ({...c, id: novoId()}));
  }
  function salvarLocal(){
    try { localStorage.setItem(KEY_LOCAL, JSON.stringify(cursos)); } catch(e){}
  }

  async function recarregar(){
    if (usaRemoto()){
      cursos = await api('GET', '?select=*&order=created_at.asc');
    } else {
      cursos = carregarLocal();
    }
  }

  async function gravar(dados, id){
    if (usaRemoto()){
      if (id) await api('PATCH', `?id=eq.${id}`, dados);
      else    await api('POST', '', dados);
      await recarregar();
    } else {
      if (id) Object.assign(cursos.find(x => x.id === id), dados);
      else    cursos.push({id: novoId(), ...dados});
      salvarLocal();
    }
  }

  async function excluir(id){
    if (usaRemoto()){
      await api('DELETE', `?id=eq.${id}`);
      await recarregar();
    } else {
      cursos = cursos.filter(x => x.id !== id);
      salvarLocal();
    }
  }

  /* ---------- coluna de cursos ---------- */
  function renderSidebar(){
    const contagem = new Map();
    cursos.forEach(c => contagem.set(c.curso, (contagem.get(c.curso) || 0) + 1));
    const nomes = [...contagem.keys()].sort((a,b) => a.localeCompare(b,'pt-BR'));

    // se o curso selecionado deixou de existir (ex.: foi excluído), volta para "todos"
    if (cursoSel && !contagem.has(cursoSel)) cursoSel = '';

    const item = (nome, qtd, ativo, valor) => `
      <li>
        <button class="item-curso" type="button" aria-pressed="${ativo}" data-curso="${esc(valor)}">
          <span class="nome" title="${esc(nome)}">${esc(nome)}</span>
          <span class="qtd">${qtd}</span>
        </button>
      </li>`;

    $('lista-cursos').innerHTML =
      item('Todos os cursos', cursos.length, cursoSel === '', '') +
      nomes.map(n => item(n, contagem.get(n), cursoSel === n, n)).join('');
  }

  $('lista-cursos').addEventListener('click', e => {
    const btn = e.target.closest('[data-curso]');
    if (!btn) return;
    cursoSel = btn.dataset.curso;
    render();
  });

  /* ---------- tabela ---------- */
  function linhaHTML(c){
    const prox = proximaData(c.datas);
    const fds = statusFds(c.datas);
    const classeBadge = fds === 'Sim' ? 'fds' : fds === 'Parcial' ? 'parcial' : '';
    const textoBadge = fds === 'Sim' ? 'Fim de semana' : fds === 'Parcial' ? 'Parcial' : 'Dias úteis';
    const chips = c.datas.slice().sort().map(d => {
      const f = isFds(d);
      return `<span class="chip ${f ? 'fds' : ''}">${fmtBR(d).slice(0,5)} · ${DIAS[toDate(d).getDay()]}</span>`;
    }).join('');
    return `
      <tr class="${fds !== 'Não' ? 'fds' : ''} ${prox ? '' : 'encerrada'}">
        <td class="nowrap">${prox ? `<span class="prox">${fmtBR(prox)}</span>` : `<span class="badge enc">Encerrada</span>`}</td>
        <td class="curso">${esc(c.curso)}</td>
        <td class="nowrap">${esc(c.turma)}</td>
        <td class="nowrap">${esc(c.horario)}</td>
        <td><div class="datas">${chips}</div></td>
        <td class="nowrap"><span class="badge ${prox ? classeBadge : 'enc'}">${prox ? textoBadge : '—'}</span></td>
        <td>
          <div class="acoes">
            <button class="btn-ghost btn-small" type="button" data-editar="${esc(c.id)}">Editar</button>
            <button class="btn-danger btn-small" type="button" data-excluir="${esc(c.id)}">Excluir</button>
          </div>
        </td>
      </tr>`;
  }

  function render(){
    renderSidebar();

    const busca = $('busca').value.trim().toLowerCase();
    const fdsF = $('filtro-fds').value;
    const ordem = $('ordem').value;

    const lista = cursos
      .filter(c => {
        if (cursoSel && c.curso !== cursoSel) return false;
        const txt = `${c.curso} ${c.turma} ${c.horario}`.toLowerCase();
        if (busca && !txt.includes(busca)) return false;
        if (fdsF && statusFds(c.datas) !== fdsF) return false;
        return true;
      })
      .sort((a,b) => {
        if (ordem === 'curso') return a.curso.localeCompare(b.curso,'pt-BR') || a.turma.localeCompare(b.turma);
        if (ordem === 'turma') return a.turma.localeCompare(b.turma,'pt-BR');
        return chaveData(a).localeCompare(chaveData(b)) || a.curso.localeCompare(b.curso,'pt-BR');
      });

    $('corpo').innerHTML = lista.length
      ? lista.map(linhaHTML).join('')
      : `<tr><td colspan="7" class="vazio">Nenhuma turma encontrada.</td></tr>`;
    $('contador').textContent = `${lista.length} de ${cursos.length} turma(s)`;

    $('filtro-curso-wrap').innerHTML = cursoSel
      ? `<span class="filtro-ativo">${esc(cursoSel)} <button type="button" id="limpar-curso" aria-label="Mostrar todos os cursos">✕</button></span>`
      : '';
  }

  $('filtro-curso-wrap').addEventListener('click', e => {
    if (e.target.closest('#limpar-curso')){
      cursoSel = '';
      render();
    }
  });

  /* ---------- modal ---------- */
  function abrirModal(c){
    editandoId = c ? c.id : null;
    $('dlg-titulo').textContent = c ? 'Editar turma' : 'Nova turma';
    $('f-turma').value = c ? c.turma : '';
    $('f-curso').value = c ? c.curso : '';
    $('f-horario').value = c ? c.horario : '';
    $('f-datas').value = c ? c.datas.slice().sort().map(fmtBR).join(', ') : '';
    $('dlg').showModal();
  }

  $('btn-novo').addEventListener('click', () => abrirModal(null));
  $('btn-cancelar').addEventListener('click', () => $('dlg').close());

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const datas = parseDatas($('f-datas').value);
    if (!datas.length){
      alert('Informe ao menos uma data no formato dd/mm/aaaa.');
      return;
    }
    const dados = {
      turma: $('f-turma').value.trim(),
      curso: $('f-curso').value.trim(),
      horario: $('f-horario').value.trim(),
      datas
    };
    $('btn-salvar').disabled = true;
    try {
      await gravar(dados, editandoId);
      $('dlg').close();
      render();
      setStatus(usaRemoto() ? 'Salvo no Supabase' : 'Salvo neste navegador');
    } catch(err){
      setStatus('Erro ao salvar: ' + err.message, true);
    } finally {
      $('btn-salvar').disabled = false;
    }
  });

  /* ---------- ações na tabela ---------- */
  $('corpo').addEventListener('click', async e => {
    const btnEd = e.target.closest('[data-editar]');
    const btnEx = e.target.closest('[data-excluir]');
    if (btnEd){
      const c = cursos.find(x => x.id === btnEd.dataset.editar);
      if (c) abrirModal(c);
    }
    if (btnEx){
      const c = cursos.find(x => x.id === btnEx.dataset.excluir);
      if (!c || !confirm(`Excluir ${c.curso} (${c.turma})?`)) return;
      try {
        await excluir(c.id);
        render();
        setStatus('Turma excluída');
      } catch(err){
        setStatus('Erro ao excluir: ' + err.message, true);
      }
    }
  });

  ['busca','filtro-fds','ordem'].forEach(id => {
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', render);
  });

  /* ---------- início ---------- */
  (async function iniciar(){
    iniciarTema();
    setStatus(usaRemoto() ? 'Carregando do Supabase…' : 'Modo local (sem Supabase configurado)');
    try {
      await recarregar();
      setStatus(usaRemoto() ? 'Sincronizado com Supabase' : 'Modo local (sem Supabase configurado)');
    } catch(err){
      cursos = carregarLocal();
      setStatus('Erro ao carregar do Supabase; usando cópia local', true);
    }
    render();
  })();
</script>
</body>
</html>
